name: Trusted benchmark auto-merge

on:
  workflow_call:
    inputs:
      pull_request_number:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      marker_comment_id:
        required: true
        type: string
    secrets:
      reviewer_token:
        required: true

permissions: {}

jobs:
  authorize:
    name: Authorize exact benchmark head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.pull.outputs.base_sha }}
      head_sha: ${{ steps.pull.outputs.head_sha }}
      marker_comment_id: ${{ steps.call.outputs.marker_comment_id }}
      pull_request_node_id: ${{ steps.pull.outputs.pull_request_node_id }}
      pull_request_number: ${{ steps.pull.outputs.pull_request_number }}
      submission_id: ${{ steps.pull.outputs.submission_id }}
    steps:
      - name: Validate exact trusted-call inputs
        id: call
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          MARKER_COMMENT_ID: ${{ inputs.marker_comment_id }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${MARKER_COMMENT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          echo "marker_comment_id=${MARKER_COMMENT_ID}" >> "${GITHUB_OUTPUT}"
      - name: Check out the exact trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Read live repository, protection, and pull request state
        id: pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          gh api repos/MahdiHedhli/LITB > "${RUNNER_TEMP}/repository.json"
          python3 scripts/trusted_submission_automation.py repository \
            --input "${RUNNER_TEMP}/repository.json"
          gh api repos/MahdiHedhli/LITB/branches/main \
            > "${RUNNER_TEMP}/protection.json"
          python3 scripts/trusted_submission_automation.py protection \
            --input "${RUNNER_TEMP}/protection.json"
          bash scripts/fetch_mergeable_pull.sh \
            "${PR_NUMBER}" "${RUNNER_TEMP}/pull-request.json"
          python3 scripts/trusted_submission_automation.py pull-request \
            --input "${RUNNER_TEMP}/pull-request.json" \
            --number "${PR_NUMBER}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --output "${GITHUB_OUTPUT}"
      - name: Fetch untrusted head as Git data and validate trusted content
        env:
          BASE_SHA: ${{ steps.pull.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pull.outputs.pull_request_number }}
          SUBMISSION_ID: ${{ steps.pull.outputs.submission_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "${BASE_SHA}"
          git fetch --no-tags --depth=1 origin "pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "${HEAD_SHA}"
          git checkout --detach "${BASE_SHA}"
          result="$(
            git show "${BASE_SHA}:scripts/validate_benchmark_change.py" |
              python3 - \
                --base "${BASE_SHA}" \
                --head "${HEAD_SHA}" \
                --require-benchmark \
                --check-content \
                --expected-submission-id "${SUBMISSION_ID}" \
                --trusted-root "${GITHUB_WORKSPACE}"
          )"
          test "${result}" = "change boundary passed: benchmark-only"
      - name: Validate full-head request, live comment, and review state
        env:
          BASE_SHA: ${{ steps.pull.outputs.base_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
          MARKER_COMMENT_ID: ${{ steps.call.outputs.marker_comment_id }}
          PR_NUMBER: ${{ steps.pull.outputs.pull_request_number }}
        run: |
          set -euo pipefail
          gh api \
            "repos/MahdiHedhli/LITB/issues/comments/${MARKER_COMMENT_ID}" \
            > "${RUNNER_TEMP}/comments.json"
          python3 scripts/trusted_submission_automation.py comments \
            --input "${RUNNER_TEMP}/comments.json" \
            --number "${PR_NUMBER}" \
            --comment-id "${MARKER_COMMENT_ID}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}"
          gh api graphql --paginate --slurp \
            -f owner=MahdiHedhli \
            -f name=LITB \
            -F number="${PR_NUMBER}" \
            -F query=@"${GITHUB_WORKSPACE}/scripts/queries/review_threads.graphql" \
            > "${RUNNER_TEMP}/threads.json"
          python3 scripts/trusted_submission_automation.py threads \
            --input "${RUNNER_TEMP}/threads.json"
          gh api --paginate --slurp \
            "repos/MahdiHedhli/LITB/pulls/${PR_NUMBER}/reviews?per_page=100" \
            > "${RUNNER_TEMP}/reviews.json"
          python3 scripts/trusted_submission_automation.py review-states \
            --input "${RUNNER_TEMP}/reviews.json"
      - name: Revalidate head and base after read-only authorization
        env:
          BASE_SHA: ${{ steps.pull.outputs.base_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.pull.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pull.outputs.pull_request_number }}
        run: |
          set -euo pipefail
          bash scripts/fetch_mergeable_pull.sh \
            "${PR_NUMBER}" "${RUNNER_TEMP}/pull-request-final.json"
          python3 scripts/trusted_submission_automation.py pull-request \
            --input "${RUNNER_TEMP}/pull-request-final.json" \
            --number "${PR_NUMBER}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --output "${RUNNER_TEMP}/pull-request-final.out"
          grep -Fqx "base_sha=${BASE_SHA}" "${RUNNER_TEMP}/pull-request-final.out"
          grep -Fqx "head_sha=${HEAD_SHA}" "${RUNNER_TEMP}/pull-request-final.out"

  mutate:
    name: Arm protected auto-merge and approve exact head
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Fetch exact trusted helpers and queries
        env:
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          fetch_trusted_file() {
            local source="$1"
            local destination="$2"
            gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/MahdiHedhli/LITB/contents/${source}?ref=${BASE_SHA}" \
              > "${destination}"
          }
          fetch_trusted_file \
            scripts/trusted_submission_automation.py \
            "${RUNNER_TEMP}/trusted_submission_automation.py"
          fetch_trusted_file \
            scripts/fetch_mergeable_pull.sh \
            "${RUNNER_TEMP}/fetch_mergeable_pull.sh"
          fetch_trusted_file \
            scripts/queries/review_threads.graphql \
            "${RUNNER_TEMP}/review_threads.graphql"
          fetch_trusted_file \
            scripts/queries/auto_merge_state.graphql \
            "${RUNNER_TEMP}/auto_merge_state.graphql"
          python3 "${RUNNER_TEMP}/trusted_submission_automation.py" --help > /dev/null
          bash -n "${RUNNER_TEMP}/fetch_mergeable_pull.sh"
          test -s "${RUNNER_TEMP}/review_threads.graphql"
          test -s "${RUNNER_TEMP}/auto_merge_state.graphql"
      - name: Revalidate without reviewer credential
        env:
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          MARKER_COMMENT_ID: ${{ needs.authorize.outputs.marker_comment_id }}
          PR_NODE_ID: ${{ needs.authorize.outputs.pull_request_node_id }}
          PR_NUMBER: ${{ needs.authorize.outputs.pull_request_number }}
          SUBMISSION_ID: ${{ needs.authorize.outputs.submission_id }}
        run: |
          set -euo pipefail
          helper="${RUNNER_TEMP}/trusted_submission_automation.py"
          mergeable_helper="${RUNNER_TEMP}/fetch_mergeable_pull.sh"
          review_threads_query="${RUNNER_TEMP}/review_threads.graphql"
          gh api repos/MahdiHedhli/LITB > "${RUNNER_TEMP}/repository.json"
          python3 "${helper}" repository --input "${RUNNER_TEMP}/repository.json"
          gh api repos/MahdiHedhli/LITB/branches/main \
            > "${RUNNER_TEMP}/protection.json"
          python3 "${helper}" protection --input "${RUNNER_TEMP}/protection.json"
          bash "${mergeable_helper}" \
            "${PR_NUMBER}" "${RUNNER_TEMP}/pull-request.json"
          python3 "${helper}" pull-request \
            --input "${RUNNER_TEMP}/pull-request.json" \
            --number "${PR_NUMBER}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --output "${RUNNER_TEMP}/pull-request.out"
          grep -Fqx "pull_request_node_id=${PR_NODE_ID}" "${RUNNER_TEMP}/pull-request.out"
          grep -Fqx "base_sha=${BASE_SHA}" "${RUNNER_TEMP}/pull-request.out"
          grep -Fqx "head_sha=${HEAD_SHA}" "${RUNNER_TEMP}/pull-request.out"
          grep -Fqx "submission_id=${SUBMISSION_ID}" "${RUNNER_TEMP}/pull-request.out"
          gh api \
            "repos/MahdiHedhli/LITB/issues/comments/${MARKER_COMMENT_ID}" \
            > "${RUNNER_TEMP}/comments.json"
          python3 "${helper}" comments \
            --input "${RUNNER_TEMP}/comments.json" \
            --number "${PR_NUMBER}" \
            --comment-id "${MARKER_COMMENT_ID}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}"
          gh api graphql --paginate --slurp \
            -f owner=MahdiHedhli -f name=LITB -F number="${PR_NUMBER}" \
            -F query=@"${review_threads_query}" \
            > "${RUNNER_TEMP}/threads.json"
          python3 "${helper}" threads --input "${RUNNER_TEMP}/threads.json"
          gh api --paginate --slurp \
            "repos/MahdiHedhli/LITB/pulls/${PR_NUMBER}/reviews?per_page=100" \
            > "${RUNNER_TEMP}/reviews.json"
          python3 "${helper}" review-states --input "${RUNNER_TEMP}/reviews.json"
      - name: Arm protected squash auto-merge, then approve the exact head
        env:
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          GH_TOKEN: ${{ secrets.reviewer_token }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          MARKER_COMMENT_ID: ${{ needs.authorize.outputs.marker_comment_id }}
          PR_NODE_ID: ${{ needs.authorize.outputs.pull_request_node_id }}
          PR_NUMBER: ${{ needs.authorize.outputs.pull_request_number }}
          SUBMISSION_ID: ${{ needs.authorize.outputs.submission_id }}
        run: |
          set -euo pipefail
          helper="${RUNNER_TEMP}/trusted_submission_automation.py"
          mergeable_helper="${RUNNER_TEMP}/fetch_mergeable_pull.sh"
          review_threads_query="${RUNNER_TEMP}/review_threads.graphql"
          auto_merge_query="${RUNNER_TEMP}/auto_merge_state.graphql"
          validate_live_authorization() {
            local label="$1"
            local destination="${RUNNER_TEMP}/${label}"
            local live_base
            gh api repos/MahdiHedhli/LITB \
              > "${destination}-repository.json"
            python3 "${helper}" repository \
              --input "${destination}-repository.json" \
              --require-auto-merge
            gh api repos/MahdiHedhli/LITB/branches/main \
              > "${destination}-base.json"
            python3 "${helper}" protection --input "${destination}-base.json"
            live_base="$(jq -er '.commit.sha | strings' "${destination}-base.json")"
            [[ "${live_base}" =~ ^[0-9a-f]{40}$ ]]
            test "${live_base}" = "${BASE_SHA}"
            bash "${mergeable_helper}" \
              "${PR_NUMBER}" "${destination}-pull.json"
            python3 "${helper}" pull-request \
              --input "${destination}-pull.json" \
              --number "${PR_NUMBER}" \
              --base "${BASE_SHA}" \
              --head "${HEAD_SHA}" \
              --output "${destination}-pull.out"
            grep -Fqx "pull_request_node_id=${PR_NODE_ID}" "${destination}-pull.out"
            grep -Fqx "submission_id=${SUBMISSION_ID}" "${destination}-pull.out"
            gh api \
              "repos/MahdiHedhli/LITB/issues/comments/${MARKER_COMMENT_ID}" \
              > "${destination}-comments.json"
            python3 "${helper}" comments \
              --input "${destination}-comments.json" \
              --number "${PR_NUMBER}" \
              --comment-id "${MARKER_COMMENT_ID}" \
              --base "${BASE_SHA}" \
              --head "${HEAD_SHA}"
            gh api graphql --paginate --slurp \
              -f owner=MahdiHedhli -f name=LITB -F number="${PR_NUMBER}" \
              -F query=@"${review_threads_query}" \
              > "${destination}-threads.json"
            python3 "${helper}" threads \
              --input "${destination}-threads.json" \
              --output "${destination}-threads.out" \
              --advisory-ids-output "${destination}-advisory-ids.txt"
            gh api --paginate --slurp \
              "repos/MahdiHedhli/LITB/pulls/${PR_NUMBER}/reviews?per_page=100" \
              > "${destination}-reviews.json"
            python3 "${helper}" review-states --input "${destination}-reviews.json"
          }
          resolve_advisory_threads() {
            local threads_json="$1"
            local ids_file="$2"
            python3 "${helper}" threads \
              --input "${threads_json}" \
              --output "${RUNNER_TEMP}/threads-resolve.out" \
              --advisory-ids-output "${ids_file}"
            if [ ! -s "${ids_file}" ]; then
              return 0
            fi
            while IFS= read -r thread_id; do
              [ -n "${thread_id}" ] || continue
              [[ "${thread_id}" =~ ^[A-Za-z0-9_=-]{4,200}$ ]]
              gh api graphql \
                -f query='mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{isResolved}}}' \
                -f id="${thread_id}" \
                > /dev/null
            done < "${ids_file}"
          }
          gh api user > "${RUNNER_TEMP}/reviewer.json"
          python3 "${helper}" identity --input "${RUNNER_TEMP}/reviewer.json"
          gh api repos/MahdiHedhli/LITB > "${RUNNER_TEMP}/repository-final.json"
          python3 "${helper}" repository \
            --input "${RUNNER_TEMP}/repository-final.json" \
            --require-auto-merge
          gh api repos/MahdiHedhli/LITB/branches/main \
            > "${RUNNER_TEMP}/protection-final.json"
          python3 "${helper}" protection --input "${RUNNER_TEMP}/protection-final.json"
          bash "${mergeable_helper}" \
            "${PR_NUMBER}" "${RUNNER_TEMP}/pull-request-final.json"
          python3 "${helper}" pull-request \
            --input "${RUNNER_TEMP}/pull-request-final.json" \
            --number "${PR_NUMBER}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --output "${RUNNER_TEMP}/pull-request-final.out"
          grep -Fqx "pull_request_node_id=${PR_NODE_ID}" "${RUNNER_TEMP}/pull-request-final.out"
          grep -Fqx "base_sha=${BASE_SHA}" "${RUNNER_TEMP}/pull-request-final.out"
          grep -Fqx "head_sha=${HEAD_SHA}" "${RUNNER_TEMP}/pull-request-final.out"
          grep -Fqx "submission_id=${SUBMISSION_ID}" "${RUNNER_TEMP}/pull-request-final.out"
          gh api \
            "repos/MahdiHedhli/LITB/issues/comments/${MARKER_COMMENT_ID}" \
            > "${RUNNER_TEMP}/comments-final.json"
          python3 "${helper}" comments \
            --input "${RUNNER_TEMP}/comments-final.json" \
            --number "${PR_NUMBER}" \
            --comment-id "${MARKER_COMMENT_ID}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}"
          gh api graphql --paginate --slurp \
            -f owner=MahdiHedhli -f name=LITB -F number="${PR_NUMBER}" \
            -F query=@"${review_threads_query}" \
            > "${RUNNER_TEMP}/threads-final.json"
          # Resolve advisory-bot threads so conversation-resolution protection
          # cannot strand otherwise-valid submissions on CodeRabbit/Codex noise.
          resolve_advisory_threads \
            "${RUNNER_TEMP}/threads-final.json" \
            "${RUNNER_TEMP}/advisory-ids-final.txt"
          gh api graphql --paginate --slurp \
            -f owner=MahdiHedhli -f name=LITB -F number="${PR_NUMBER}" \
            -F query=@"${review_threads_query}" \
            > "${RUNNER_TEMP}/threads-post-resolve.json"
          python3 "${helper}" threads \
            --input "${RUNNER_TEMP}/threads-post-resolve.json" \
            --output "${RUNNER_TEMP}/threads-post-resolve.out" \
            --advisory-ids-output "${RUNNER_TEMP}/advisory-ids-post-resolve.txt"
          test ! -s "${RUNNER_TEMP}/advisory-ids-post-resolve.txt"
          gh api --paginate --slurp \
            "repos/MahdiHedhli/LITB/pulls/${PR_NUMBER}/reviews?per_page=100" \
            > "${RUNNER_TEMP}/reviews-final.json"
          python3 "${helper}" review-states --input "${RUNNER_TEMP}/reviews-final.json"
          python3 "${helper}" approvals \
            --input "${RUNNER_TEMP}/reviews-final.json" \
            --head "${HEAD_SHA}" \
            --output "${RUNNER_TEMP}/approval-state.out"
          gh api graphql \
            -f owner=MahdiHedhli -f name=LITB -F number="${PR_NUMBER}" \
            -F query=@"${auto_merge_query}" \
            > "${RUNNER_TEMP}/auto-merge-before.json"
          python3 "${helper}" auto-merge-state \
            --input "${RUNNER_TEMP}/auto-merge-before.json" \
            --pull-request-node-id "${PR_NODE_ID}" \
            --head "${HEAD_SHA}" \
            --submission-id "${SUBMISSION_ID}" \
            --output "${RUNNER_TEMP}/auto-merge-before.out"
          if grep -Fqx "enabled=false" "${RUNNER_TEMP}/auto-merge-before.out"; then
            if grep -Fqx "exists=true" "${RUNNER_TEMP}/approval-state.out"; then
              grep -Fqx "review_decision=APPROVED" "${RUNNER_TEMP}/auto-merge-before.out"
            else
              grep -Fqx "exists=false" "${RUNNER_TEMP}/approval-state.out"
              grep -Fqx "review_decision=REVIEW_REQUIRED" "${RUNNER_TEMP}/auto-merge-before.out"
            fi
            headline="data: add benchmark submission ${SUBMISSION_ID:0:12}"
            commit_body="Schema-validated self-reported benchmark record; run unverified."
            validate_live_authorization "before-auto-merge"
            gh api graphql \
              -f id="${PR_NODE_ID}" \
              -f head="${HEAD_SHA}" \
              -f headline="${headline}" \
              -f body="${commit_body}" \
              -f query='mutation($id:ID!,$head:GitObjectID!,$headline:String!,$body:String!){enablePullRequestAutoMerge(input:{pullRequestId:$id,expectedHeadOid:$head,mergeMethod:SQUASH,commitHeadline:$headline,commitBody:$body}){pullRequest{id headRefOid autoMergeRequest{mergeMethod}}}}' \
              > "${RUNNER_TEMP}/enable-auto-merge.json"
          else
            grep -Fqx "enabled=true" "${RUNNER_TEMP}/auto-merge-before.out"
          fi
          gh api "repos/MahdiHedhli/LITB/pulls/${PR_NUMBER}" \
            > "${RUNNER_TEMP}/pull-request-after-arm.json"
          test "$(jq -r '.head.sha' "${RUNNER_TEMP}/pull-request-after-arm.json")" = "${HEAD_SHA}"
          if [ "$(jq -r '.merged' "${RUNNER_TEMP}/pull-request-after-arm.json")" = "true" ]; then
            test "$(jq -r '.state' "${RUNNER_TEMP}/pull-request-after-arm.json")" = "closed"
            echo "trusted benchmark auto-merge completed"
            exit 0
          fi
          test "$(jq -r '.state' "${RUNNER_TEMP}/pull-request-after-arm.json")" = "open"
          bash "${mergeable_helper}" \
            "${PR_NUMBER}" "${RUNNER_TEMP}/pull-request-before-approval.json"
          python3 "${helper}" pull-request \
            --input "${RUNNER_TEMP}/pull-request-before-approval.json" \
            --number "${PR_NUMBER}" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --output "${RUNNER_TEMP}/pull-request-before-approval.out"
          grep -Fqx "base_sha=${BASE_SHA}" "${RUNNER_TEMP}/pull-request-before-approval.out"
          grep -Fqx "head_sha=${HEAD_SHA}" "${RUNNER_TEMP}/pull-request-before-approval.out"
          gh api graphql \
            -f owner=MahdiHedhli -f name=LITB -F number="${PR_NUMBER}" \
            -F query=@"${auto_merge_query}" \
            > "${RUNNER_TEMP}/auto-merge-armed.json"
          python3 "${helper}" auto-merge-state \
            --input "${RUNNER_TEMP}/auto-merge-armed.json" \
            --pull-request-node-id "${PR_NODE_ID}" \
            --head "${HEAD_SHA}" \
            --submission-id "${SUBMISSION_ID}" \
            --output "${RUNNER_TEMP}/auto-merge-armed.out"
          grep -Fqx "enabled=true" "${RUNNER_TEMP}/auto-merge-armed.out"
          gh api graphql --paginate --slurp \
            -f owner=MahdiHedhli -f name=LITB -F number="${PR_NUMBER}" \
            -F query=@"${review_threads_query}" \
            > "${RUNNER_TEMP}/threads-before-approval.json"
          python3 "${helper}" threads --input "${RUNNER_TEMP}/threads-before-approval.json"
          if grep -Fqx "exists=false" "${RUNNER_TEMP}/approval-state.out"; then
            approval_body="Exact-head approval after trusted benchmark authorization."
            validate_live_authorization "before-approval"
            gh api graphql \
              -f id="${PR_NODE_ID}" \
              -f head="${HEAD_SHA}" \
              -f body="${approval_body}" \
              -f query='mutation($id:ID!,$head:GitObjectID!,$body:String!){addPullRequestReview(input:{pullRequestId:$id,commitOID:$head,event:APPROVE,body:$body}){pullRequestReview{state commit{oid} author{login ... on User{databaseId}}}}}' \
              > "${RUNNER_TEMP}/approval-result.json"
            python3 "${helper}" approval-result \
              --input "${RUNNER_TEMP}/approval-result.json" \
              --head "${HEAD_SHA}"
          else
            grep -Fqx "exists=true" "${RUNNER_TEMP}/approval-state.out"
          fi
          gh api "repos/MahdiHedhli/LITB/pulls/${PR_NUMBER}" \
            > "${RUNNER_TEMP}/pull-request-after.json"
          test "$(jq -r '.head.sha' "${RUNNER_TEMP}/pull-request-after.json")" = "${HEAD_SHA}"
          final_state="$(jq -r '.state' "${RUNNER_TEMP}/pull-request-after.json")"
          final_merged="$(jq -r '.merged' "${RUNNER_TEMP}/pull-request-after.json")"
          if [ "${final_merged}" = "true" ]; then
            echo "trusted benchmark auto-merge completed"
          else
            test "${final_state}" = "open"
            gh api graphql \
              -f owner=MahdiHedhli -f name=LITB -F number="${PR_NUMBER}" \
              -F query=@"${auto_merge_query}" \
              > "${RUNNER_TEMP}/auto-merge-after.json"
            python3 "${helper}" auto-merge-state \
              --input "${RUNNER_TEMP}/auto-merge-after.json" \
              --pull-request-node-id "${PR_NODE_ID}" \
              --head "${HEAD_SHA}" \
              --submission-id "${SUBMISSION_ID}" \
              --output "${RUNNER_TEMP}/auto-merge-after.out"
            grep -Fqx "enabled=true" "${RUNNER_TEMP}/auto-merge-after.out"
            echo "trusted benchmark auto-merge armed"
          fi
